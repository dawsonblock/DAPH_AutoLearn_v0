# Production-qualification template. This intentionally refuses to load until
# max_kl_drift is replaced with a validation-calibrated value.
model:
  hidden_size: 1024
  num_layers: 28
  intermediate_size: 3072
  num_attention_heads: 16

gdn2:
  enabled: true
  every_n_layers: 2
  head_dim: 64
  num_heads: 16
  expand_v: 1.0
  mode: chunk
  use_short_conv: true
  allow_neg_eigval: false
  external_module: lit_gpt.gdn2
  external_class: GatedDeltaNet2

repobrain:
  repo_embedding_dim: 2048
  hidden_dim: 512
  rank: 8
  alpha: 16.0
  layer_groups: 4
  target_modules: [q_proj, v_proj, o_proj, down_proj]
  output_scale_init: 0.01

controller:
  max_kl_drift: null  # replace from scripts/calibrate_controller.py
  require_calibrated_kl: true
  max_validation_loss_regression: 0.02
  max_execution_regression: 0.01
  max_generic_regression: 0.01
  scale_grid: [1.0, 0.9, 0.75, 0.5, 0.25]
  hard_fisher_grid: [0.05, 0.10, 0.15, 0.20, 0.30]
  soft_fisher_grid: [0.05, 0.10, 0.25, 0.5, 1.0, 2.0]
  min_retained_energy: 0.95
  max_reconstruction_error: 0.10

vision:
  enabled: false
  structural_dim: 768
  semantic_dim: 1024
  daph_hidden_size: 1024
  fusion_tokens: 64
